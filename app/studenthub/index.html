<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Hub</title>
  <meta name="theme-color" content="#173b8a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fed'/%3E%3Cpath d='M32 14 8 26l24 12 20-10v14h4V26z' fill='white'/%3E%3Cpath d='M18 34v9c0 4 6.3 7 14 7s14-3 14-7v-9l-14 7z' fill='white' opacity='.85'/%3E%3C/svg%3E">
  <script
    id="sap-ui-bootstrap"
    src="https://sdk.openui5.org/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-libs="sap.m,sap.ui.core,sap.ui.layout"
    data-sap-ui-resourceroots='{"studenthub.nov": "./"}'
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-frameOptions="trusted">
  </script>
  <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body class="sapUiBody">
  <div id="content"></div>
  <script>
    sap.ui.getCore().attachInit(function () {
      sap.ui.require([
        "sap/ui/core/ComponentContainer",
        "sap/ui/core/Component"
      ], function (ComponentContainer, Component) {
        Component.create({
          name: "studenthub.nov",
          id: "studenthubComponent"
        }).then(function (oComponent) {
          new ComponentContainer({
            component: oComponent,
            height: "100%"
          }).placeAt("content");
        });
      });
    });
  </script>
</body>
</html>
